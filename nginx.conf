server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types {}
    add_header Cache-Control "no-cache";
  }

  # Service worker e HTML: sempre revalidar (para o PWA pegar atualizações).
  location ~* (sw\.js|workbox-.*\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
